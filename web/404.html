<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Shia Companion</title>
  <link rel="icon" type="image/png" href="/favicon.ico">
  <style>
    body {
      margin: 0;
      color: #2e2723;
      background: #fff;
      font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.3;
      margin: 0 0 12px;
    }

    h2 {
      font-size: 18px;
      margin: 28px 0 8px;
    }

    a {
      color: #5d4037;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #f7eee9;
        background: #171411;
      }

      a {
        color: #d7b8a8;
      }
    }
  </style>
</head>
<body>
  <!-- Firebase Hosting serves this with a 404 status for any path that is not
       a real file and matches none of the rewrites in firebase.json. Before,
       a single "**" rewrite answered every unknown URL with the app shell and
       a 200, which Google reports as a soft 404. -->
  <main>
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved.</p>
    <ul>
      <li><a href="/">Open Shia Companion</a></li>
      <li><a href="/zikr">All duas, ziyarats and zikr</a></li>
    </ul>
    <h2>Frequently read</h2>
    <ul>
      <li><a href="/zikr/dua-kumayl">Dua Kumayl</a></li>
      <li><a href="/zikr/dua-tawassul">Dua Tawassul</a></li>
      <li><a href="/zikr/ziyarat-e-ashura">Ziyarat Ashura</a></li>
      <li><a href="/zikr/dua-e-nudbah">Dua-e-Nudbah</a></li>
      <li><a href="/zikr/dua-e-ahad">Dua e Ahad</a></li>
    </ul>
  </main>
</body>
</html>
