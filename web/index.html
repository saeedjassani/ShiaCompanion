<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Access authentic Shia duas, ziyarats, and prayer times with the Shia Companion app. Available for iOS, Android, and Web.">
  <meta name="keywords" content="Shia app, duas, ziyarat, prayer times, Islamic, Shia Companion">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Shia Companion">
  <meta property="og:description" content="Explore duas, ziyarats, and prayer times for Shia Muslims.">
  <meta property="og:url" content="https://shia-companion.web.app/">
  <meta property="og:type" content="website">
  <!-- Absolute, so /index.html and the preview-channel hostnames all point at
       the one production URL instead of competing with it in the index. The
       generated zikr pages replace this with their own canonical. -->
  <link rel="canonical" href="https://shia-companion.web.app/">

  <!-- iOS/Android web app meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Shia Companion">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico" />
  <link rel="manifest" href="manifest.json">
  <title>Shia Companion - Dua, Ziyarat & Prayer Times</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #3e2723;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app-loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #app-loading img {
      width: 72px;
      height: 72px;
      border-radius: 16px;
    }

    #app-loading-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    @media (prefers-color-scheme: dark) {
      #app-loading {
        background: #171411;
        color: #f7eee9;
      }
    }
  </style>
</head>

<body>
  <div id="app-loading" role="status" aria-label="Loading Shia Companion">
    <div id="app-loading-content">
      <img src="icons/Icon-192.png" width="72" height="72" alt="">
      <div id="app-loading-name">Shia Companion</div>
    </div>
  </div>
  <script>
    (function () {
      const loadingShell = document.getElementById('app-loading');
      const hasSeoContent = document.querySelector('.seo-zikr-content') !== null;
      let seoFallbackTimer;

      function removeLoadingShell() {
        if (seoFallbackTimer) {
          window.clearTimeout(seoFallbackTimer);
        }
        loadingShell.remove();
      }

      window.addEventListener(
        'flutter-first-frame',
        removeLoadingShell,
        { once: true }
      );

      // Generated zikr pages include readable HTML for search engines and as a
      // no-app fallback. Keep it behind the loading shell during normal Flutter
      // startup, but reveal it if Flutter cannot produce a frame.
      if (hasSeoContent) {
        seoFallbackTimer = window.setTimeout(removeLoadingShell, 15000);
      }
    })();
  </script>
  <script>
    (function () {
      const path = window.location.pathname || '/';
      const isContentPath = path !== '/' && path !== '/index.html';
      const isAndroid = /Android/i.test(navigator.userAgent);
      const isIos =
        /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isStandalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
      const androidStoreUrl =
        'https://play.google.com/store/apps/details?id=com.developer110.shiacompanion';
      const iosStoreUrl = 'https://apps.apple.com/app/id1492517189';
      const redirectKey = 'shia-companion-open-app-' + path;
      const bannerDismissedKey = 'shia-companion-download-banner-dismissed';

      if ((!isAndroid && !isIos) || isStandalone) {
        return;
      }

      function getIntentUrl() {
        return (
          'intent://' +
          window.location.host +
          path +
          window.location.search +
          window.location.hash +
          '#Intent;scheme=https;package=com.developer110.shiacompanion;S.browser_fallback_url=' +
          encodeURIComponent(androidStoreUrl) +
          ';end'
        );
      }

      function openAndroidApp() {
        window.location.href = getIntentUrl();
      }

      function getDownloadUrl() {
        if (isAndroid && isContentPath) {
          return getIntentUrl();
        }
        return isAndroid ? androidStoreUrl : iosStoreUrl;
      }

      function createDownloadAppBanner() {
        if (sessionStorage.getItem(bannerDismissedKey) === '1') {
          return;
        }

        const banner = document.createElement('div');
        banner.setAttribute(
          'style',
          'position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:9999;display:flex;align-items:center;gap:12px;border:1px solid rgba(93,64,55,.18);border-radius:18px;padding:12px;background:rgba(255,255,255,.96);color:#2e2723;font:14px system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-shadow:0 14px 32px rgba(0,0,0,.18);backdrop-filter:blur(14px);'
        );

        const icon = document.createElement('img');
        icon.src = 'icons/Icon-192.png';
        icon.alt = '';
        icon.setAttribute(
          'style',
          'width:42px;height:42px;border-radius:10px;flex:0 0 auto;'
        );

        const copy = document.createElement('div');
        copy.setAttribute('style', 'min-width:0;flex:1;line-height:1.25;');

        const title = document.createElement('div');
        title.textContent = 'Get Shia Companion';
        title.setAttribute(
          'style',
          'font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'
        );

        const subtitle = document.createElement('div');
        subtitle.textContent = isAndroid && isContentPath
          ? 'Open or install the app.'
          : 'Download the mobile app.';
        subtitle.setAttribute(
          'style',
          'margin-top:2px;color:#6d5d55;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'
        );

        const cta = document.createElement('a');
        cta.href = getDownloadUrl();
        cta.textContent = 'Get';
        cta.setAttribute(
          'style',
          'flex:0 0 auto;border-radius:999px;padding:10px 16px;background:#5d4037;color:#fff;font-weight:700;text-decoration:none;'
        );

        const close = document.createElement('button');
        close.type = 'button';
        close.textContent = 'x';
        close.setAttribute('aria-label', 'Dismiss download banner');
        close.setAttribute(
          'style',
          'flex:0 0 auto;border:0;background:transparent;color:#6d5d55;font:700 18px system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:4px 2px;'
        );
        close.addEventListener('click', function () {
          sessionStorage.setItem(bannerDismissedKey, '1');
          banner.remove();
        });

        copy.appendChild(title);
        copy.appendChild(subtitle);
        banner.appendChild(icon);
        banner.appendChild(copy);
        banner.appendChild(cta);
        banner.appendChild(close);

        function appendBanner() {
          document.body.appendChild(banner);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', appendBanner);
        } else {
          appendBanner();
        }
      }

      async function maybeOpenInstalledApp() {
        if (!isAndroid ||
          !isContentPath ||
          typeof navigator.getInstalledRelatedApps !== 'function' ||
          sessionStorage.getItem(redirectKey) === '1'
        ) {
          return;
        }

        try {
          const relatedApps = await navigator.getInstalledRelatedApps();
          const hasAndroidApp = relatedApps.some(function (app) {
            return app.id === 'com.developer110.shiacompanion';
          });

          if (hasAndroidApp) {
            sessionStorage.setItem(redirectKey, '1');
            openAndroidApp();
          }
        } catch (_) {
          // Ignore detection failures and keep the web page usable.
        }
      }

      let bannerScheduled = false;

      function scheduleDownloadAppBanner() {
        if (bannerScheduled) {
          return;
        }
        bannerScheduled = true;
        window.setTimeout(createDownloadAppBanner, 2500);
      }

      window.addEventListener(
        'flutter-first-frame',
        scheduleDownloadAppBanner,
        { once: true }
      );
      window.setTimeout(function () {
        if (!bannerScheduled) {
          bannerScheduled = true;
          createDownloadAppBanner();
        }
      }, 10000);
      maybeOpenInstalledApp();
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
