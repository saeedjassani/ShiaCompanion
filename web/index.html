<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Access authentic Shia duas, ziyarats, and prayer times with the Shia Companion app. Available for iOS, Android, and Web.">
  <meta name="keywords" content="Shia app, duas, ziyarat, prayer times, Islamic, Shia Companion">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Shia Companion">
  <meta property="og:description" content="Explore duas, ziyarats, and prayer times for Shia Muslims.">
  <meta property="og:url" content="https://shia-companion.web.app/">
  <meta property="og:type" content="website">

  <!-- iOS/Android web app meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Shia Companion">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico" />
  <link rel="manifest" href="manifest.json">
  <title>Shia Companion - Dua, Ziyarat & Prayer Times</title>
</head>

<body>
  <!-- This script installs service_worker.js to provide PWA functionality to
       application. For more information, see:
       https://developers.google.com/web/fundamentals/primers/service-workers -->
  <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-auth.js"></script>

  <!-- Use flutter.js to bootstrap the service worker as recommended by Flutter docs -->
  <script src="flutter.js" defer></script>
  <script src="main.dart.js" type="application/javascript"></script>
  <script>
    (function () {
      const path = window.location.pathname || '/';
      const isContentPath = path !== '/' && path !== '/index.html';
      const isAndroid = /Android/i.test(navigator.userAgent);
      const redirectKey = 'shia-companion-open-app-' + path;

      if (!isContentPath || !isAndroid) {
        return;
      }

      function getIntentUrl() {
        const fallbackUrl = window.location.href;
        return (
          'intent://' +
          window.location.host +
          path +
          window.location.search +
          window.location.hash +
          '#Intent;scheme=https;package=com.developer110.shiacompanion;S.browser_fallback_url=' +
          encodeURIComponent(fallbackUrl) +
          ';end'
        );
      }

      function openAndroidApp() {
        window.location.href = getIntentUrl();
      }

      function createOpenAppBanner() {
        const banner = document.createElement('button');
        banner.type = 'button';
        banner.textContent = 'Open in app';
        banner.setAttribute(
          'style',
          'position:fixed;top:16px;right:16px;z-index:9999;border:0;border-radius:999px;padding:12px 18px;background:#5d4037;color:#fff;font:600 14px system-ui,-apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 10px 25px rgba(0,0,0,.18);cursor:pointer;'
        );
        banner.addEventListener('click', openAndroidApp);
        document.addEventListener('DOMContentLoaded', function () {
          document.body.appendChild(banner);
        });
      }

      async function maybeOpenInstalledApp() {
        createOpenAppBanner();

        if (
          typeof navigator.getInstalledRelatedApps !== 'function' ||
          sessionStorage.getItem(redirectKey) === '1'
        ) {
          return;
        }

        try {
          const relatedApps = await navigator.getInstalledRelatedApps();
          const hasAndroidApp = relatedApps.some(function (app) {
            return app.id === 'com.developer110.shiacompanion';
          });

          if (hasAndroidApp) {
            sessionStorage.setItem(redirectKey, '1');
            openAndroidApp();
          }
        } catch (_) {
          // Ignore detection failures and keep the web page usable.
        }
      }

      maybeOpenInstalledApp();
    })();
  </script>
</body>

</html>
