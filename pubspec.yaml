name: shia_companion
description: All the features needed by the lovers of Ahle Bayt (may Allah's peace and blessings be upon them) in one app

version: 3.3.10+104
environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  app_links: ^7.1.1
  auth_buttons: ^3.0.0
  date_format: ^2.0.7
  firebase_auth: ^6.1.3
  firebase_crashlytics: ^5.0.6
  firebase_database: ^12.1.1
  flutter_local_notifications: ^21.0.0
  hijri: ^3.0.0
  share_plus: ^13.1.0
  shared_preferences: ^2.1.1
  table_calendar: ^3.0.9
  url_launcher: ^6.1.11
  wakelock_plus: ^1.4.0
  webfeed_revised: ^0.9.0
  yaml: ^3.1.2
  flutter_markdown_plus: ^1.0.7
  webview_flutter: ^4.13.0
  webview_flutter_web: ^0.2.3+4
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  flutter_timezone: ^5.0.1
  timezone: ^0.11.0
  firebase_analytics: ^12.1.2
  package_info_plus: ^10.1.0
  cloud_firestore: ^6.1.1
  arabic_reshaper: ^0.0.1
  cupertino_icons: ^1.0.8 
  file_picker: ^12.0.0-beta.5
  path_provider: ^2.1.1
  sign_in_with_apple: ^8.0.0
  geolocator: ^14.0.1
  crypto: ^3.0.7
  connectivity_plus: ^6.0.5
  flutter_compass: ^0.8.1
  web: ^1.1.1
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/airports.tsv
    - assets/books.json
    - assets/events.json
    - assets/items.json
    - assets/logo.png
    - assets/retired_slugs.json
    - assets/zikr.json
    - assets/hadith/
    - assets/images/
    - assets/zikr/

  fonts:
    - family: Qalam
      fonts:
        - asset: assets/fonts/qalam
    # Scheherazade New (SIL, OFL — see assets/fonts/ScheherazadeNew-OFL.txt)
    # replaced MeQuran and KFGQPC Uthmani, neither of which could draw the
    # Indo-Pak letterforms the corpus is written in. Across all 410 zikr
    # documents it leaves 0.11% of characters without a glyph, against
    # MeQuran's 3.25% and Uthmani's 2.39%.
    - family: Scheherazade
      fonts:
        - asset: assets/fonts/scheherazade.ttf
