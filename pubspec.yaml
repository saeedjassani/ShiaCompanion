name: shia_companion
description: All the features needed by the lovers of Ahle Bayt (may Allah's peace and blessings be upon them) in one app

version: 3.0.2+64

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  app_links: ^6.4.0
  auth_buttons: ^3.0.0
  csv: ^6.0.0
  date_format: ^2.0.7
  firebase_auth: ^6.1.3
  firebase_crashlytics: ^5.0.6
  firebase_database: ^12.1.1
  flutter_local_notifications: ^20.1.0
  hijri: ^3.0.0
  location: ^8.0.1
  share_plus: ^12.0.1
  shared_preferences: ^2.1.1
  table_calendar: ^3.0.9
  url_launcher: ^6.1.11
  wakelock_plus: ^1.4.0
  webfeed_revised: ^0.9.0
  yaml: ^3.1.2
  flutter_markdown_plus: ^1.0.7
  webview_flutter: ^4.13.0
  webview_flutter_web: ^0.2.3+4
  intl: ^0.20.2
  the_apple_sign_in: ^1.1.1
  google_sign_in: ^7.2.0
  timezone: ^0.10.1
  firebase_analytics: ^12.1.2
  package_info_plus: ^9.0.0
  cloud_firestore: ^6.1.1
  arabic_reshaper: ^0.0.1
  cupertino_icons: ^1.0.8 
  file_picker: ^11.0.2
  path_provider: ^2.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/zikr/
    - assets/items/
    - assets/hadith.csv

  fonts:
    - family: Qalam
      fonts:
        - asset: assets/fonts/qalam
    - family: MeQuran
      fonts:
        - asset: assets/fonts/me_quran.ttf
    - family: Uthmani
      fonts:
        - asset: assets/fonts/uthmani.otf
