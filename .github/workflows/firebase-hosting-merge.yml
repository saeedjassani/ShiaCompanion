# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Refresh zikr release assets
        run: node scripts/build_zikr_release.js --allow-stale-on-error
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ZIKR_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_SHIA_COMAPNION }}
      - name: Generate hadith shards
        run: node scripts/generate_hadith_shards.js
      - run: flutter build web --wasm
      - name: Generate zikr SEO pages
        run: node scripts/generate_zikr_seo_pages.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIA_COMAPNION }}
          channelId: live
          projectId: shia-comapnion
