name: Flutter CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java (use LTS version 17)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'  # more reliable than 'beta' for CI
          cache: true        # built-in caching for Flutter SDK

      # 4️⃣ Get Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 5️⃣ Analyze code
      - name: Static code analysis
        run: flutter analyze

      # 6️⃣ Run tests
      - name: Run widget tests
        run: flutter test --no-pub

      # 7️⃣ Build Android APK
      - name: Set up Android SDK & accept licenses
        run: |
          # Ensure ANDROID_SDK_ROOT is set (default path on GitHub-hosted macOS runners)
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/Users/runner/Library/Android/sdk}" >> $GITHUB_ENV
          # Try to accept licenses via sdkmanager (if available)
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi
      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 8️⃣ Prepare CocoaPods (for iOS builds)
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod repo update
          pod install --verbose

      # 8️⃣ Detect Podfile.lock changes (if any)
      - name: Check for changes
        id: check-changes
        run: |
          if [[ -n "$(git status ios/Podfile.lock --porcelain)" ]]; then
            echo "CHANGES_DETECTED=true" >> $GITHUB_ENV
          fi

      # 9️⃣ Commit & push Podfile.lock if changed
      - name: Commit and push changes
        if: env.CHANGES_DETECTED == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ios/Podfile.lock
          git commit -m "Update Podfile.lock [skip ci]"
          git push

      # 🔟 Build iOS app (no code signing)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign
