name: Flutter CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java (use LTS version 17)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'  # more reliable than 'beta' for CI
          cache: true        # built-in caching for Flutter SDK

      # 4️⃣ Get Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 5️⃣ Analyze code
      - name: Static code analysis
        run: flutter analyze

      # 6️⃣ Run tests
      - name: Run widget tests
        run: flutter test --no-pub

      # 7️⃣ Prepare CocoaPods (for iOS builds)
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod repo update
          pod install --verbose

      # 8️⃣ Detect Podfile.lock changes (if any)
      - name: Check for changes
        id: check-changes
        run: |
          if [[ -n "$(git status ios/Podfile.lock --porcelain)" ]]; then
            echo "CHANGES_DETECTED=true" >> $GITHUB_ENV
          fi

      # 9️⃣ Commit & push Podfile.lock if changed
      - name: Commit and push changes
        if: env.CHANGES_DETECTED == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ios/Podfile.lock
          git commit -m "Update Podfile.lock [skip ci]"
          git push

      # 🔟 Build iOS app (no code signing)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign
