name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new Flutter stable release can never turn CI red on its own.
  # Bump deliberately, in this one place.
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --no-pub --reporter expanded

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web build and visual checks
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-web
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          firebase-service-account-json: ${{ secrets.FIREBASE_ZIKR_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_SHIA_COMAPNION }}

      - uses: ./.github/actions/visual-tests
        with:
          build-dir: build/web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  android:
    name: Android release APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      # The release build is minified and resource-shrunk, so its size is the
      # number worth watching. Printed to the job summary so a size regression
      # is visible on the PR instead of needing the artifact downloaded.
      - name: Report APK size
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          bytes=$(stat -c%s "$apk")
          printf '### Release APK\n\n**%s** (%s bytes)\n\n' \
            "$(numfmt --to=iec --suffix=B "$bytes")" "$bytes" >> "$GITHUB_STEP_SUMMARY"
          printf 'Largest entries:\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          # Through a file rather than a pipe into head: head closes the pipe
          # on its fifteenth line and sort dies of SIGPIPE mid-write, which
          # logs "sort: write error" on an otherwise green step.
          unzip -l "$apk" | sort -rn -k1 > /tmp/apk-entries.txt
          head -15 /tmp/apk-entries.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: iOS build
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show selected Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS app
        run: flutter build ios --release --no-codesign
