name: Cross-Platform Smoke Crawler Test

on:
  workflow_dispatch:
    inputs:
      simulator_device:
        description: 'iOS Simulator device name (e.g. iPhone 16)'
        required: false
        default: 'iPhone 16'
        type: string
      android_api_level:
        description: 'Android emulator API level'
        required: false
        default: '33'
        type: string

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  ios-smoke-test:
    name: Run iOS Smoke Crawler
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Boot Simulator and Run Smoke Test
        run: |
          DEVICE_NAME="${{ inputs.simulator_device || 'iPhone 16' }}"
          echo "==> Booting iOS Simulator: ${DEVICE_NAME}"
          xcrun simctl boot "${DEVICE_NAME}" || true

          echo "==> Running Smoke Crawler Integration Test..."
          flutter test integration_test/smoke_crawler_test.dart -d "${DEVICE_NAME}"

      - name: Report Results
        if: always()
        run: |
          cat << 'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ### iOS Smoke Crawler Test

          - **Device Target:** `${{ inputs.simulator_device || 'iPhone 16' }}`
          - **Test:** `integration_test/smoke_crawler_test.dart`
          - **Status:** Complete
          SUMMARY

  android-smoke-test:
    name: Run Android Smoke Crawler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM (required for the emulator to run at usable speed)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Emulator and Run Smoke Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ fromJSON(inputs.android_api_level || '33') }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/smoke_crawler_test.dart -d emulator-5554

      - name: Report Results
        if: always()
        run: |
          cat << 'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ### Android Smoke Crawler Test

          - **API Level:** `${{ inputs.android_api_level || '33' }}`
          - **Test:** `integration_test/smoke_crawler_test.dart`
          - **Status:** Complete
          SUMMARY
