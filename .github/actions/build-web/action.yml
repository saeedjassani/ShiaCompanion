name: Build web bundle
description: >
  Builds the Flutter web bundle into build/web, including the generated hadith
  shards and the pre-rendered zikr, Quran and library SEO pages.

inputs:
  site-origin:
    description: Origin baked into the generated SEO pages and sitemap.
    required: false
    default: 'https://shiacompanion.app'

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Install script dependencies
      shell: bash
      run: npm install

    - name: Generate hadith shards
      shell: bash
      run: node scripts/generate_hadith_shards.js

    - shell: bash
      run: flutter pub get

    - name: Build web bundle
      shell: bash
      run: flutter build web --wasm

    # The /library pages are made from the shiavault-library repo's book
    # metadata. Only the metadata.yml files are fetched (a couple of seconds),
    # then condensed to one JSON file with the same YAML parser the app uses.
    - name: Fetch library metadata
      shell: bash
      run: |
        git clone --quiet --depth 1 --filter=blob:none --sparse \
          https://github.com/saeedjassani/shiavault-library "$RUNNER_TEMP/shiavault-library"
        git -C "$RUNNER_TEMP/shiavault-library" sparse-checkout set --no-cone '/books/*/metadata.yml'
        dart run scripts/library_seo_index.dart \
          "$RUNNER_TEMP/shiavault-library" "$RUNNER_TEMP/library_seo_index.json"

    # Must target build/web. The script defaults to the web/ source directory,
    # which `flutter build web` has already copied by this point, so on a clean
    # CI checkout the generated pages and sitemap land somewhere nothing reads.
    # Locally this is masked: the pre-commit push hook generates into web/
    # before the build, so they get copied along with everything else.
    - name: Generate zikr SEO pages
      shell: bash
      run: node scripts/generate_zikr_seo_pages.js
      env:
        WEB_BUILD_DIR: build/web
        SITE_ORIGIN: ${{ inputs.site-origin }}
        LIBRARY_INDEX: ${{ runner.temp }}/library_seo_index.json
