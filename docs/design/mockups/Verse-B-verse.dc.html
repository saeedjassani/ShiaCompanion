<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Go to a verse, choose a verse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#6D4C35}a:hover{color:#4A3426}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #4F4740; color: #2A1E16; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', sans-serif">
  <section aria-label="Go to a verse" style="position: absolute; left: 0; right: 0; top: 60px; bottom: 0; box-sizing: border-box; padding: 8px 16px 34px; border-radius: 16px 16px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9CEBF"></span>
    <div style="display: flex; align-items: center; gap: 8px">
      <button aria-label="Back to surahs" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; border: none; background: #F2EBE1; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A1E16" aria-hidden="true" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Al-Baqarah</h2>
        <span style="font-size: 15px; line-height: 20px; color: #6A5A4D">Step 2 of 2 · Choose a verse (1 to 286)</span>
      </div>
      <button aria-label="Close" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; border: none; background: #F2EBE1; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A1E16" aria-hidden="true" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <button style="height: 46px; border-radius: 23px; border: 1px solid #D9CEBF; background: #FFFFFF; color: #2A1E16; font-size: 16px; font-weight: 600; cursor: pointer">Start of surah (verse 1)</button>

    <div style="display: flex; gap: 8px; margin-right: -16px; overflow: hidden">
      <button style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #D9CEBF; background: #FFFFFF; color: #2A1E16; font-size: 15px; font-weight: 500; cursor: pointer">1–50</button>
      <button style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #D9CEBF; background: #FFFFFF; color: #2A1E16; font-size: 15px; font-weight: 500; cursor: pointer">51–100</button>
      <button style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #D9CEBF; background: #FFFFFF; color: #2A1E16; font-size: 15px; font-weight: 500; cursor: pointer">101–150</button>
      <button style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #D9CEBF; background: #FFFFFF; color: #2A1E16; font-size: 15px; font-weight: 500; cursor: pointer">151–200</button>
      <button style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #D9CEBF; background: #FFFFFF; color: #2A1E16; font-size: 15px; font-weight: 500; cursor: pointer">201–250</button>
      <button aria-pressed="true" style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #6D4C35; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">251–286</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{verses}}" as="v" hint-placeholder-count="36">
        <button aria-label="{{v.aria}}" style="{{v.style}}">{{v.n}}</button>
      </sc-for>
    </div>

    <button style="margin-top: auto; height: 54px; border-radius: 27px; border: none; background: #6D4C35; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer">Open Al-Baqarah 2:255</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var base = 'height: 48px; border-radius: 12px; font-size: 17px; font-variant-numeric: tabular-nums; cursor: pointer; ';
    var verses = [];
    for (var n = 251; n <= 286; n++) {
      var picked = n === 255;
      verses.push({
        n: String(n),
        aria: 'Verse ' + n,
        style: base + (picked ? 'border: none; background: #6D4C35; color: #FFFFFF; font-weight: 700' : 'border: none; background: #F6F1EA; color: #2A1E16; font-weight: 500')
      });
    }
    return { verses: verses };
  }
}
</script>
</body>
</html>
