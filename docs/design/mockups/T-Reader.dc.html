<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet reading a dua</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Qalam';src:url(/_blob/d5d1bb57f046a6be658e48261d0cd523) format('truetype');font-display:swap}
body{margin:0}
a{color:#6D4C35}a:hover{color:#4A3426}
button{font:inherit}
</style>
</helmet>
<div style="width: 820px; height: 1180px; position: relative; overflow: hidden; background: #FBF8F3; color: #2A1E16; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', sans-serif">
  <div style="position: absolute; left: 90px; top: 112px; width: 640px; display: flex; flex-direction: column; text-align: center">
    <button style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; margin-bottom: 8px; border-radius: 18px; border: 1px solid #D9CEBF; background: #FFFFFF; color: #6D4C35; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8h.01"></path></svg>Merits</button>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; padding: 6px 0 16px; border-bottom: 1px solid #E6DDD0; margin-bottom: 8px">
        <p dir="rtl" lang="ar" style="margin: 0; font-family: 'Qalam', serif; font-size: 34px; line-height: 68px">{{g.ar}}</p>
        <p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; letter-spacing: 0.2px">{{g.tr}}</p>
        <p style="margin: 2px 0 0; font-size: 17px; line-height: 25px; color: #4E4036">{{g.en}}</p>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 96px; box-sizing: border-box; padding: 44px 24px 0; display: flex; align-items: center; gap: 8px; background: rgba(251,248,243,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px)">
    <button aria-label="Back" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E8E0D5; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <span style="flex: 1; display: flex; flex-direction: column; align-items: center"><span style="font-size: 18px; line-height: 23px; font-weight: 600">Dua Kumayl</span><span style="font-size: 13px; line-height: 17px; color: #6A5A4D">12% read</span></span>
    <button aria-label="Add to favorites" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E8E0D5; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="#6D4C35" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 1.6; stroke-linejoin: round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #EFE7DC"><span style="display: block; width: 12%; height: 3px; background: #6D4C35"></span></span>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(251,248,243,0) 0%, rgba(251,248,243,0.92) 55%, #FBF8F3 100%); pointer-events: none"></div>
  <nav aria-label="Reading tools" style="position: absolute; left: 190px; bottom: 28px; width: 440px; height: 62px; box-sizing: border-box; padding: 4px; border-radius: 31px; background: rgba(255,255,255,0.84); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(42,30,22,0.10); box-shadow: 0 8px 28px rgba(42,30,22,0.14); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px">
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; border: none; background: transparent; color: #2A1E16; font-size: 11px; line-height: 13px; font-weight: 500; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><path d="M6 4h12v16l-6-4-6 4z"></path></svg>Bookmark</button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; border: none; background: transparent; color: #2A1E16; font-size: 11px; line-height: 13px; font-weight: 500; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="#6D4C35" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 1.6; stroke-linejoin: round"><path d="M8 5.5v13l10-6.5z"></path></svg>Listen</button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; border: none; background: transparent; color: #2A1E16; font-size: 11px; line-height: 13px; font-weight: 500; cursor: pointer"><span aria-hidden="true" style="height: 22px; display: flex; align-items: center; font-size: 17px; font-weight: 700; color: #6D4C35">Aa</span>Text</button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; border: none; background: transparent; color: #2A1E16; font-size: 11px; line-height: 13px; font-weight: 500; cursor: pointer"><img src="/_blob/4e12a2c7dc6d2f873644bb29e6cdad10" alt="" style="width: 22px; height: 22px">Counter</button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; border: none; background: transparent; color: #2A1E16; font-size: 11px; line-height: 13px; font-weight: 500; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>Share</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { ar: 'بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ', tr: 'BISMIL LAAHIR RAHMAANIR RAHEEM', en: 'In the name of Allah, the Beneficent, the Merciful.' },
        { ar: 'اَللّٰهُمَّ اِنِّىْ اَسْاَلُكَ بِرَحْمَتِكَ الَّتِىْ وَسِعَتْ كُلَّ شَيْءٍ', tr: 'ALLAAHUMMA INNI AS-ALOKA BERAHMATEKAL LATEE WASEA’T KULLA SHAY-IN', en: 'O Allah! I ask You by Your mercy, which encompasses all things' },
        { ar: 'وَبِقُوَّتِكَ الَّتِىْ قَهَرْتَ بِهَا كُلَّ شَيْءٍ', tr: 'WA BE-QUWWATEKAL LATEE QAHARTA BEHAA KULLA SHAY-IN', en: 'And by Your strength, through which You dominate all things,' },
        { ar: 'وَخَضَعَ لَهَا كُلُّ شَيْءٍ', tr: 'WA KHAZA-A’ LAHAA KULLO SHAY-IN', en: 'And to which all things submit' },
        { ar: 'وَذَلَّ لَهَا كُلُّ شَيْءٍ', tr: 'WA ZALLA LAHAA KULLO SHAY-IN', en: 'And before which all things are humble;' }
      ]
    };
  }
}
</script>
</body>
</html>
