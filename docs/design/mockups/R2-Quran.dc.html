<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quran tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Qalam';src:url(/_blob/d5d1bb57f046a6be658e48261d0cd523) format('truetype');font-display:swap}
body{margin:0}
a{color:#6D4C35}a:hover{color:#4A3426}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F8F5F0; color: #2A1E16; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', sans-serif">
  <div style="position: absolute; left: 0; top: 58px; right: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.4px">Quran</h1>
      <div style="display: flex; gap: 4px">
        <button aria-label="Recent sessions" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E8E0D5; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M4 12a8 8 0 1 0 2.3-5.6"></path><path d="M4 4v4h4M12 8v4l3 2"></path></svg></button>
        <button aria-label="My Stats" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E8E0D5; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"></path></svg></button>
      </div>
    </div>

    <div style="display: flex; gap: 10px; margin-right: -16px; overflow: hidden">
      <a href="#" style="flex: 0 0 200px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 18px; background: #4A3426; color: #FBF6EE; text-decoration: none">
        <span style="font-size: 13px; line-height: 16px; color: #D9CBB8">My reading</span>
        <span style="margin-top: 2px; font-size: 17px; line-height: 21px; font-weight: 600">Al-Baqarah 142</span>
        <span style="font-size: 13px; line-height: 17px; color: #E4C27A">4% of the Quran</span>
      </a>
      <a href="#" style="flex: 0 0 200px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E8E0D5; color: #2A1E16; text-decoration: none">
        <span style="font-size: 13px; line-height: 16px; color: #6A5A4D">Family</span>
        <span style="margin-top: 2px; font-size: 17px; line-height: 21px; font-weight: 600">Ya-Sin 1</span>
        <span style="font-size: 13px; line-height: 17px; color: #6A5A4D">Start reading</span>
      </a>
    </div>

    <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 25px; border: 1px solid #6D4C35; background: #FFFFFF; color: #6D4C35; font-size: 17px; font-weight: 600; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      Go to a verse
    </button>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #EDE5DA">
      <button aria-pressed="true" style="height: 38px; border-radius: 11px; border: none; background: #FFFFFF; color: #2A1E16; font-size: 15px; font-weight: 600; box-shadow: 0 1px 3px rgba(42,30,22,0.15); cursor: pointer">Surahs</button>
      <button aria-pressed="false" style="height: 38px; border-radius: 11px; border: none; background: transparent; color: #6A5A4D; font-size: 15px; font-weight: 600; cursor: pointer">Juz</button>
      <button aria-pressed="false" style="height: 38px; border-radius: 11px; border: none; background: transparent; color: #6A5A4D; font-size: 15px; font-weight: 600; cursor: pointer">Collections</button>
    </div>

    <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E0D5; overflow: hidden">
      <sc-for list="{{surahs}}" as="s" hint-placeholder-count="5">
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-bottom: 1px solid #EFE7DC; color: #2A1E16; text-decoration: none">
          <span style="flex-shrink: 0; width: 34px; height: 34px; border-radius: 17px; background: #F2EBE1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{s.n}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 17px; line-height: 22px">{{s.name}}</span><span style="font-size: 13px; line-height: 17px; color: #6A5A4D">{{s.count}}</span></span>
          <span dir="rtl" lang="ar" style="font-family: 'Qalam', serif; font-size: 21px; line-height: 34px">{{s.ar}}</span>
        </a>
      </sc-for>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(248,245,240,0) 0%, rgba(248,245,240,0.92) 55%, #F8F5F0 100%); pointer-events: none"></div>
  <nav aria-label="Main" style="position: absolute; left: 16px; right: 88px; bottom: 26px; height: 62px; box-sizing: border-box; padding: 4px; border-radius: 31px; background: rgba(255,255,255,0.84); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(42,30,22,0.10); box-shadow: 0 8px 28px rgba(42,30,22,0.14); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; color: #2A1E16; text-decoration: none; font-size: 11px; line-height: 13px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19.5z"></path></svg>Home</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; background: rgba(109,76,53,0.12); color: #6D4C35; text-decoration: none; font-size: 11px; line-height: 13px; font-weight: 700"><img src="/_blob/e9653bf1936c05a427e7ff402326c1d2" alt="" style="width: 24px; height: 24px">Quran</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; color: #2A1E16; text-decoration: none; font-size: 11px; line-height: 13px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Favorites</a>
  </nav>
  <button aria-label="Search" style="position: absolute; right: 16px; bottom: 26px; width: 62px; height: 62px; border-radius: 31px; background: rgba(255,255,255,0.84); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(42,30,22,0.10); box-shadow: 0 8px 28px rgba(42,30,22,0.14); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6D4C35" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      surahs: [
        { n: '1', name: 'Al-Fatihah', count: '7 verses', ar: 'الفاتحة' },
        { n: '2', name: 'Al-Baqarah', count: '286 verses', ar: 'البقرة' },
        { n: '3', name: "Ali 'Imran", count: '200 verses', ar: 'آل عمران' },
        { n: '4', name: 'An-Nisa', count: '176 verses', ar: 'النساء' },
        { n: '5', name: "Al-Ma'idah", count: '120 verses', ar: 'المائدة' }
      ]
    };
  }
}
</script>
</body>
</html>
