plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 36
    ndkVersion "28.2.13676358"


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId "com.developer110.shiacompanion"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

    }
    signingConfigs {
        release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] != null ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            multiDexKeepFile file('multidex-config.txt')
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // R8 strips the code nothing reaches; shrinkResources does the
            // same for resources. What normally makes both unsafe is anything
            // found by name at runtime, and both such cases here are already
            // covered: every Android component is declared in
            // AndroidManifest.xml, from which AGP generates keep rules, and
            // res/raw/keep.xml pins @drawable/* and @raw/* against the
            // resource shrinker — flutter_local_notifications resolves the
            // azan sounds and the notification icon through
            // Resources.getIdentifier(), which no static analysis can see.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Obfuscated frames would make every release crash report
            // unreadable, so the mapping file still gets uploaded - just not
            // as part of this task graph. mappingFileUploadEnabled true wires
            // uploadCrashlyticsMappingFileRelease as a dependency of assemble/
            // bundleRelease, so a transient failure talking to Crashlytics'
            // ingest endpoint (seen on Codemagic: "503 Service Unavailable")
            // fails the whole release build over a step that has nothing to
            // do with producing the APK/AAB.
            //
            // Confirmed the hard way: mappingFileUploadEnabled false does NOT
            // just skip that automatic wiring - with this plugin version it
            // stops uploadCrashlyticsMappingFileRelease from being registered
            // at all ("Task 'uploadCrashlyticsMappingFileRelease' not found
            // in root project 'android' and its subprojects"), so there was
            // no task left for
            // android/scripts/upload_crashlytics_mapping_with_retry.sh to run
            // on its own afterwards. Gating on a project property instead:
            // the default (no property passed) keeps it false so the normal
            // `flutter build` step Codemagic/CI runs is never blocked by
            // Crashlytics. Passing -PenableCrashlyticsMappingUpload=true -
            // which only the retry script's own, separate `./gradlew
            // uploadCrashlyticsMappingFileRelease` invocation does - flips it
            // to true for just that invocation, so the task actually exists
            // to run (with retries) after the build has already succeeded.
            firebaseCrashlytics {
                mappingFileUploadEnabled project.hasProperty('enableCrashlyticsMappingUpload') &&
                    project.property('enableCrashlyticsMappingUpload').toString().toBoolean()
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    lint {
        disable 'InvalidPackage'
    }
    testOptions {
        unitTests {
            // The widget tests (src/test/.../widgets) render the Glance
            // widgets under Robolectric, which needs the app's resources.
            includeAndroidResources = true
            all {
                // Robolectric downloads one Android jar per SDK it runs on,
                // from Maven Central unless told otherwise; the mirror the
                // Wear OS build uses, which doesn't rate-limit CI.
                systemProperty 'robolectric.dependency.repo.url',
                    'https://maven-central.storage-download.googleapis.com/maven2'
                maxHeapSize = '3g'
                // SDK 36's ApplicationSharedMemory sets a FileDescriptor's
                // private fd, which JDK 17+ refuses Robolectric without these.
                jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }
    namespace 'com.developer110.shiacompanion'
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub in local unit tests; AzanScheduleRulesTest needs the real one.
    testImplementation 'org.json:json:20240303'
    // Renders the home-screen widgets on each Android version (see
    // src/test/.../widgets).
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core-ktx:1.7.0'
    // The versions Flutter's integration_test plugin already puts in the debug
    // app (runner 1.3.0, espresso 3.3.0): AGP resolves the instrumented
    // tests against the app's own classpath and refuses newer ones.
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    // 1.2.0, not 1.1.x: 1.1's receiver could leave a newly placed widget on
    // its loading spinner. Its goAsync() fails on some OEM builds before
    // Android 15 (b/257513022), which 1.2 routes through a worker instead, and
    // it cancelled the write that lets getGlanceIds() find the widget, so the
    // app's refreshes skipped it.
    implementation 'androidx.glance:glance-appwidget:1.2.0'
    // Glance renders every widget through WorkManager; it only asks for
    // 2.7.1 (2021), which predates Android 13 and 14's background changes.
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    // Native Azan playback reports what kept an Azan from playing. Same BoM
    // firebase_core resolves (its FirebaseSDKVersion), so no second version.
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // Sends prayer times to the Wear OS app (android/wear); see WearSync.
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
